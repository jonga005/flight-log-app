<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Log tests</title>
<style>body{font-family:Consolas,monospace;font-size:13px;padding:16px} .pass{color:#16a34a} .fail{color:#dc2626;font-weight:bold}</style>
<script>window.APP_CONFIG = { mode: 'local', localDataUrl: '../backups/2026-09-14_master_raw.json', pilotName: 'John H Gallaher' };</script>
</head>
<body>
<h3>Flight Log unit tests</h3>
<pre id="results">running…</pre>
<script src="../vendor/xlsx.full.min.js"></script>
<script src="../vendor/pdf-lib.min.js"></script>
<script src="../js/fields.js"></script>
<script src="../js/data.js"></script>
<script src="../js/export.js"></script>
<script src="../js/import.js"></script>
<script src="../js/exhibit30.js"></script>
<script src="../js/summary.js"></script>
<script src="../js/logbook.js"></script>
<script src="../js/report.js"></script>
<script src="fixture_coulson.js"></script>
<script>
'use strict';
const results = [];
function eq(a, b, msg) {
  if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || '') + ' expected ' + JSON.stringify(b) + ' got ' + JSON.stringify(a));
}
function near(a, b, msg) { if (Math.abs(a - b) > 0.051) throw new Error((msg || '') + ' expected ~' + b + ' got ' + a); }
function ok(c, msg) { if (!c) throw new Error(msg || 'assertion failed'); }
async function test(name, fn) {
  try { await fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: e.message || String(e) }); }
}
const NOW = new Date(2026, 8, 14, 12, 0, 0); // 2026-09-14 local

(async function run() {
  // ---- fields ----
  await test('FIELDS has 32 fields with the expected keys', () => {
    eq(FIELDS.length, 32);
    eq(FIELD_KEYS.slice(0, 6), ['date', 'tail_number', 'aircraft', 'route_from', 'route_to', 'total_time']);
    eq(FIELD_KEYS[31], 'notes');
    eq(NUM_FIELDS.length, 26);
  });
  await test('normalizeFields coerces types', () => {
    const r = normalizeFields({ date: '2026-01-02', total_time: '1.5', pic: 'x', notes: null });
    eq(r.total_time, 1.5); eq(r.pic, 0); eq(r.notes, ''); eq(r.tail_number, ''); eq(r.drops, 0);
  });
  await test('ymd uses local date parts', () => {
    eq(ymd(new Date(2026, 7, 14, 23, 30)), '2026-08-14');
    eq(ymd(new Date(2026, 0, 1, 0, 0)), '2026-01-01');
  });
  await test('fmtNum formatting', () => { eq(fmtNum(0), ''); eq(fmtNum(2), '2'); eq(fmtNum(1.25), '1.3'); eq(fmtNum(4.6), '4.6'); });

  // ---- import: dates ----
  await test('ImportMod.toDateStr handles Date, US string, ISO string, garbage', () => {
    eq(ImportMod.toDateStr(new Date(2026, 7, 14, 23, 30)), '2026-08-14');
    eq(ImportMod.toDateStr('8/14/2026'), '2026-08-14');
    eq(ImportMod.toDateStr('2026-08-14'), '2026-08-14');
    eq(ImportMod.toDateStr('garbage'), null);
    eq(ImportMod.toDateStr(''), null);
  });

  // ---- import: workbook / columns ----
  const bytes = new TextEncoder().encode(window.FIXTURE_CSV);
  const parsed = ImportMod.readWorkbook(bytes);
  let colMap = null;
  await test('readWorkbook parses the sample CSV (35 legs)', () => {
    eq(parsed.rows.length, 35);
    ok(Object.keys(parsed.rows[0]).length >= 20, 'columns');
  });
  await test('detectColumns maps the Coulson headers', () => {
    colMap = ImportMod.detectColumns(Object.keys(parsed.rows[0]));
    eq(colMap.date, 'date'); eq(colMap.callsign, 'callsign'); eq(colMap.model, 'model');
    eq(colMap.depart, 'depart'); eq(colMap.arrive, 'arrive'); eq(colMap.block_time, 'block_time');
    eq(colMap.drops, 'drops'); eq(colMap.pic_name, 'pic'); eq(colMap.sic_name, 'sic'); eq(colMap.task, 'task');
  });
  const groups = ImportMod.groupByDay(parsed.rows, colMap);
  await test('groupByDay yields 10 days with correct local dates', () => {
    eq(Object.keys(groups).sort(), ['2026-08-14', '2026-08-27', '2026-08-28', '2026-08-29', '2026-08-30', '2026-09-01', '2026-09-03', '2026-09-04', '2026-09-05', '2026-09-07']);
    eq(groups['2026-08-28'].length, 7);
  });
  const entries = ImportMod.buildEntries(groups, colMap, 'Gallaher', '');
  await test('buildEntries: 10 entries sorted by date', () => {
    eq(entries.length, 10); eq(entries[0].date, '2026-08-14'); eq(entries[9].date, '2026-09-07');
  });
  await test('buildEntries: single-leg day (2026-08-14)', () => {
    const e = entries[0];
    eq(e.tail_number, 'T-137'); eq(e.aircraft, 'B733'); eq(e.route_from, 'KRTS'); eq(e.route_to, 'KRTS');
    near(e.total_time, 0.4); eq(e.cross_country, 0); eq(e.drops, 2); eq(e.day_landings, 1);
    near(e.pic, 0.4); eq(e.sic, 0); near(e.b737_pic, 0.4); near(e.jet, 0.4); near(e.multi_engine, 0.4); near(e.over_12500, 0.4);
    eq(e.notes, 'Bug');
  });
  await test('buildEntries: multi-leg day route chain + sums (2026-08-27)', () => {
    const e = entries[1];
    eq(e.route_from, 'KLGD-KBAM-KBOI-KBOI'); eq(e.route_to, '');
    near(e.total_time, 4.6); near(e.cross_country, 4.6); eq(e.drops, 6); eq(e.day_landings, 4);
    near(e.pic, 4.6); eq(e.sic, 0); near(e.b737_total, 4.6); near(e.b737_pic, 4.6); eq(e.c130_total, 0);
    eq(e.notes, 'Calico');
  });
  await test('buildEntries: SIC by first-leg pilot name (2026-08-28)', () => {
    const e = entries[2];
    near(e.total_time, 7.1); eq(e.pic, 0); near(e.sic, 7.1); eq(e.b737_pic, 0); near(e.b737_total, 7.1);
    eq(e.route_from, 'KBOI-KBAM-KBAM-KBOI-KBOI'); eq(e.day_landings, 7);
  });
  await test('buildEntries: XC only counts legs > 0.6, blank drops ignored (2026-08-29)', () => {
    const e = entries[3];
    near(e.total_time, 1.6); near(e.cross_country, 1.1); eq(e.drops, 2); eq(e.notes, 'Calico; Crooked');
    eq(e.route_from, 'KBOI'); eq(e.route_to, 'KBOI');
  });
  await test('buildEntries: matches existing master entry for 2026-09-07', () => {
    const e = entries[9];
    near(e.total_time, 3.7); near(e.cross_country, 3.1); eq(e.drops, 4); eq(e.day_landings, 4); eq(e.notes, 'Burnett Gulch; Lookou; Lookout');
  });
  await test('buildEntries: aircraft override and pilot name changes', () => {
    const e = ImportMod.buildEntries(groups, colMap, 'hayes', 'LC-130')[1];
    eq(e.aircraft, 'LC-130'); near(e.c130_total, 4.6); near(e.turbo_prop, 4.6); eq(e.jet, 0); eq(e.pic, 0); near(e.sic, 4.6); near(e.c130_sic, 4.6);
  });
  await test('buildEntries: no pilot name -> neither PIC nor SIC', () => {
    const e = ImportMod.buildEntries(groups, colMap, '', '')[0];
    eq(e.pic, 0); eq(e.sic, 0);
  });
  await test('inferAircraft falls back to TAIL_MAP then raw model', () => {
    eq(ImportMod.inferAircraft('Something', 'T-133', ''), 'LC-130');
    eq(ImportMod.inferAircraft('Unknown-Model', 'ZZZ', ''), 'Unknown-Model');
    eq(ImportMod.inferAircraft('RJ85', '', ''), 'B462');
  });
  await test('flagDupes: same date + same tail, or same date + time within 0.5h', () => {
    const list = ImportMod.buildEntries(groups, colMap, 'Gallaher', '');
    const existing = [
      { date: '2026-09-07', tail_number: 'T-137', total_time: 3.7 },   // tail match
      { date: '2026-08-14', tail_number: 'X', total_time: 0.6 },       // time within 0.5
      { date: '2026-08-27', tail_number: 'X', total_time: 9.9 }        // no match
    ];
    const n = ImportMod.flagDupes(list, existing);
    eq(n, 2);
    eq(list.find(e => e.date === '2026-09-07')._isDupe, true);
    eq(list.find(e => e.date === '2026-08-14')._isDupe, true);
    eq(list.find(e => e.date === '2026-08-27')._isDupe, false);
  });

  // ---- Exhibit 30 ----
  const synth = [
    { date: '2026-09-01', aircraft: 'B733', pic: 2, total_time: 2, over_12500: 2, night: 1, actual_inst: 0.5, sim_inst: 0.5, night_landings: 2, day_landings: 1, drops: 3, b737_total: 2, b737_pic: 2 },
    { date: '2026-08-01', aircraft: 'LC-130', pic: 3, total_time: 3, over_12500: 3, c130_total: 3, c130_pic: 3, day_landings: 2, drops: 1 },
    { date: '2026-05-01', aircraft: 'C182', pic: 1.5, total_time: 1.5, single_engine: 1.5, day_landings: 3 },
    { date: '2020-01-01', aircraft: 'B733', pic: 10, total_time: 10, over_12500: 10, night: 4, drops: 7, b737_total: 10, b737_pic: 10 }
  ].map(normalizeFields);
  let computed = null;
  await test('Exhibit30.compute field formulas', () => {
    computed = Exhibit30.compute(synth, 'C-130', NOW);
    const f = computed.fields;
    eq(f['Hours20 Total Pilot Time Airplane'], '17');
    eq(f['Hours21 PilotinCommand PIC Airplane'], '17');
    eq(f['Hours22 Total PIC Multiengine over 12500lbs'], '15');
    eq(f['Hours23 Total PIC Night'], '5');
    eq(f['Hours24 Total PIC Instrument'], '1');
    eq(f['Hours25 Total PIC Instrument Actual'], '1');
    eq(f['Hours26 Total Flight Time Last 12 Months'], '7');
    eq(f['Hours27 PIC Airplane Last 12 Months'], '7');
    eq(f['Hours28 Total Mountainous Terrain'], '15', 'box 28 = over_12500');
    eq(f['Hours29 PIC Low Level Below 500 AGL'], '15', 'box 29 = over_12500');
    eq(f['Hours30 Night TO  Lndgs Previous 90 Days'], '2');
    eq(f['Hours31 PIC Make and Model Previous 90 Days'], '3');
    eq(f['Hours32 Left Seat TO  Lndgs Previous 60 Days'], '5');
    eq(f['Text14'], '3'); eq(f['Text15'], '3'); eq(f['Text146'], '12'); eq(f['Text16'], '12');
    eq(f['Text24'], '2'); eq(f['Text26'], '15');
    eq(computed.drops12, 4);
  });
  await test('Exhibit30.compute box 31 for B-737 and Both', () => {
    eq(Exhibit30.compute(synth, 'B-737', NOW).box31, '2');
    eq(Exhibit30.compute(synth, 'Both', NOW).box31, '3/2');
  });
  await test('Exhibit30.fill writes fields into the bundled template (pdf-lib)', async () => {
    const res = await fetch('../assets/exhibit30_template.pdf');
    ok(res.ok, 'template fetch');
    const tpl = new Uint8Array(await res.arrayBuffer());
    const out = await Exhibit30.fill(tpl, computed, { name: 'Test Pilot', email: '' }, 'editable');
    ok(out.length > 100000, 'output size');
    const doc = await PDFLib.PDFDocument.load(out);
    const form = doc.getForm();
    eq(form.getTextField('Hours28 Total Mountainous Terrain').getText(), '15');
    eq(form.getTextField('Hours31 PIC Make and Model Previous 90 Days').getText(), '3');
    eq(form.getTextField('1 Name Last First Middle Initial').getText(), 'Test Pilot');
    ok((form.getTextField('2 Email Address').getText() || '').length > 0, 'blank personal field keeps template value');
    const flat = await Exhibit30.fill(tpl, computed, null, 'flat');
    const fdoc = await PDFLib.PDFDocument.load(flat);
    eq(fdoc.getForm().getFields().length, 0, 'flattened has no fields');
  });

  // ---- summary / currency / report ----
  await test('Summary.periodFilter cutoffs', () => {
    const rows = [{ date: '2026-09-10' }, { date: '2026-07-01' }, { date: '2026-01-15' }, { date: '2025-10-01' }, { date: '2020-01-01' }];
    eq(Summary.periodFilter(rows, 'all', NOW).length, 5);
    eq(Summary.periodFilter(rows, 'last30', NOW).length, 1);
    eq(Summary.periodFilter(rows, 'last90', NOW).length, 2);
    eq(Summary.periodFilter(rows, 'year', NOW).length, 3);
    eq(Summary.periodFilter(rows, 'last12', NOW).length, 4);
  });
  await test('Logbook.currency figures', () => {
    const c = Logbook.currency(synth, NOW);
    eq(c.dayLandings90, 3); eq(c.nightLandings90, 2); eq(c.landings90, 5);
    eq(c.approaches6mo, 0); near(c.hours12mo, 6.5); near(c.hours30d, 2); near(c.hours90d, 5);
  });
  await test('Report.buildReportHTML has totals rows and signature block', () => {
    const numCols = FIELDS.filter(f => ['total_time', 'pic'].indexOf(f.key) >= 0);
    const html = Report.buildReportHTML(synth.slice(0, 2), numCols, '2026-08-01', '2026-09-30', synth, '', true);
    ok(html.includes('PERIOD TOTALS'), 'period totals'); ok(html.includes('GRAND TOTALS'), 'grand totals');
    ok(html.includes('John H Gallaher'), 'printed name'); ok(html.includes('>Date<'), 'date line');
    ok(html.includes('>5.0<'), 'period total 5.0'); ok(html.includes('>16.5<'), 'grand total 16.5');
  });
  await test('ExportMod.csvText quotes commas and quotes', () => {
    const txt = ExportMod.csvText([{ date: '2026-01-01', notes: 'a, "b"', total_time: 1.5 }], FIELDS.filter(f => ['date', 'total_time', 'notes'].indexOf(f.key) >= 0));
    eq(txt.split('\n')[0], 'Date,Total Time,Notes');
    eq(txt.split('\n')[1], '2026-01-01,1.5,"a, ""b"""');
  });

  // ---- Data facade with LocalAdapter against the real backup ----
  LocalAdapter.STORAGE_KEY = 'flightlog_test_overlay';
  localStorage.removeItem(LocalAdapter.STORAGE_KEY);
  await test('LocalAdapter loads the master dataset (1611 rows, 9124.1 h, 8346.6 PIC)', async () => {
    await Data.init(); await Data.load();
    const all = Data.all();
    eq(all.length, 1611);
    near(sumKey(all, 'total_time'), 9124.1); near(sumKey(all, 'pic'), 8346.6);
    eq(all[0].id, 'hist-0'); eq(all[0].source, 'historical');
    ok(all[0].date <= all[1].date, 'sorted');
  });
  let addedId = null;
  await test('Data.add / update / remove / history with overlay persistence', async () => {
    const e = await Data.add({ date: '2026-09-13', tail_number: 'T-137', aircraft: 'B733', total_time: 1.2, pic: 1.2 }, 'manual');
    addedId = e.id;
    ok(/^[0-9a-f-]{36}$/.test(e.id), 'uuid'); eq(e.source, 'manual'); ok(e.created_at, 'created_at');
    eq(Data.all().length, 1612);
    await Data.update(addedId, { total_time: 1.4 });
    near(Data.get(addedId).total_time, 1.4);
    eq(Data.get(addedId).tail_number, 'T-137', 'update keeps other fields');
    const h = await Data.history(addedId);
    eq(h.map(x => x.action), ['create', 'update']);
    await Data.remove(addedId);
    eq(Data.all().length, 1611);
    ok(Data.get(addedId).deleted_at, 'soft deleted');
    // persistence: reload from overlay
    await Data.load();
    eq(Data.all().length, 1611);
    ok(Data.get(addedId) && Data.get(addedId).deleted_at, 'deleted entry persisted in overlay');
    await Data.setSetting('hiddenCols', ['jet']);
    await Data.load();
    eq(Data.getSetting('hiddenCols'), ['jet']);
  });
  await test('Data.update on a historical entry persists via overlay', async () => {
    await Data.update('hist-5', { notes: 'edited in test' });
    await Data.load();
    eq(Data.get('hist-5').notes, 'edited in test');
    eq(Data.all().length, 1611);
    near(sumKey(Data.all(), 'total_time'), 9124.1);
  });
  await test('Data.exportAll shape', () => {
    const x = Data.exportAll();
    eq(x.count, 1611); eq(x.fields.length, 32); ok(x.rows[0].id, 'rows have ids');
  });
  localStorage.removeItem(LocalAdapter.STORAGE_KEY);

  const passed = results.filter(r => r.ok).length, failed = results.length - passed;
  document.getElementById('results').innerHTML = results.map(r =>
    r.ok ? '<span class="pass">PASS</span> ' + r.name : '<span class="fail">FAIL</span> ' + r.name + ' :: ' + r.err
  ).join('\n') + '\n\nSUMMARY: ' + passed + ' passed, ' + failed + ' failed';
  document.title = (failed ? 'FAIL ' : 'PASS ') + passed + '/' + results.length;
})();
</script>
</body>
</html>
